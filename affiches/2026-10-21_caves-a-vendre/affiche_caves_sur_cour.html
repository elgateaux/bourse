<!doctype html><html lang="fr"><head><meta charset="utf-8">
<title>Caves à vendre sur cour</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=block">
<style>
@page { size: A4; margin: 0; }
:root { --ink: #13222A; --muted: #4A5A61; --accent: #A3201B; --paper: #FFFFFF;
  --display: "Archivo", "Arial Narrow", Arial, sans-serif; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--display); }
.page { width: 210mm; height: 297mm; padding: 12mm; display: flex; }
.cadre { flex: 1; display: flex; flex-direction: column; border: 1.4mm solid var(--ink); }
.bandeau { background: var(--accent); color: #fff; text-align: center; padding: 13mm 0 12mm;
  font-weight: 850; font-stretch: 112%; font-size: 30mm; line-height: 1; letter-spacing: .03em; }
.objet { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 11mm; }
.caves { font-weight: 900; font-stretch: 100%; font-size: 46mm; line-height: .9; letter-spacing: .02em; }
.lieu { display: flex; align-items: center; gap: 6mm; color: var(--accent); white-space: nowrap;
  font-weight: 800; font-stretch: 100%; font-size: 24mm; line-height: 1; letter-spacing: .04em; }
.lieu::before, .lieu::after { content: ""; width: 12mm; height: 1.4mm; background: var(--accent); }
.contact { border-top: .6mm solid var(--ink); padding: 11mm 10mm 13mm; text-align: center; }
.merci { font-weight: 500; font-stretch: 100%; font-size: 11.5mm; line-height: 1.1; color: var(--muted); }
.merci strong { font-weight: 800; color: var(--ink); }
.tel { display: inline-flex; align-items: center; gap: 6mm; margin-top: 7mm; padding: 5mm 10mm;
  border: 1.2mm solid var(--ink); border-radius: 4mm;
  font-weight: 800; font-stretch: 100%; font-size: 19mm; line-height: 1; letter-spacing: .02em;
  font-variant-numeric: tabular-nums; white-space: nowrap; }
.tel svg { width: 14mm; height: 14mm; flex: none; }
</style></head><body>
<div class="page"><div class="cadre">
  <div class="bandeau">À VENDRE</div>
  <div class="objet">
    <div class="caves">CAVES</div>
    <div class="lieu">SUR COUR</div>
  </div>
  <div class="contact">
    <div class="merci">Merci de contacter <strong>Anne</strong></div>
    <div class="tel"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1l-2.3 2.2Z"/></svg>06 59 19 12 69</div>
  </div>
</div></div>
</body></html>
